<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autumn OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="desktop">

        <header class="top-navbar">
            <div class="nav-left">
                <span class="nav-brand"> Autumn OS</span>
            </div>
            <div class="nav-right">
                <span id="current-date">Sun, Sep 20</span>
                <span id="battery-status">🔋 100%</span>
            </div>
        </header>


        <main class="center-clock-container">
            <h1 id="center-time">4:30</h1>
            <p id="center-date-sub">Sunday, September 20</p>
        </main>

        <div class="window" id="app-notepad">
            <div class="window-header">
                <span>📝 Notepad</span>
                <button class="close-btn" onclick="closeApp('app-notepad')">×</button>
            </div>
            <div class="window-content">
                <textarea class="notepad-area" placeholder="Write your thoughts here..."></textarea>
            </div>
        </div>


        <div class="window" id="app-calculator">
            <div class="window-header">
                <span>🧮 Calculator</span>
                <button class="close-btn" onclick="closeApp('app-calculator')">×</button>
            </div>
            <div class="window-content calc-body">
                <input type="text" id="calc-screen" readonly value="0">
                <div class="calc-buttons">
                    <button onclick="clearCalc()">C</button>
                    <button onclick="appendCalc('/')">/</button>
                    <button onclick="appendCalc('*')">*</button>
                    <button onclick="appendCalc('-')">-</button>
                    <button onclick="appendCalc('7')">7</button>
                    <button onclick="appendCalc('8')">8</button>
                    <button onclick="appendCalc('9')">9</button>
                    <button onclick="appendCalc('+')">+</button>
                    <button onclick="appendCalc('4')">4</button>
                    <button onclick="appendCalc('5')">5</button>
                    <button onclick="appendCalc('6')">6</button>
                    <button onclick="solveCalc()" class="equal-btn">=</button>
                    <button onclick="appendCalc('1')">1</button>
                    <button onclick="appendCalc('2')">2</button>
                    <button onclick="appendCalc('3')">3</button>
                    <button onclick="appendCalc('0')">0</button>
                </div>
            </div>
        </div>

       <div id="paint-app" class="window" style="display: none;">
    <div class="window-header">
        <span class="window-title">Paint</span>
        <button class="close-btn" onclick="document.getElementById('paint-app').style.display='none'">×</button>
    </div>
    <div class="paint-toolbar">
        <label for="paint-color">Color:</label>
        <input type="color" id="paint-color" value="#000000">
        
        <label for="paint-size">Size:</label>
        <input type="range" id="paint-size" min="1" max="50" value="5">
        <span id="size-display">5px</span>
        
        <button id="paint-clear-btn">Clear</button>
    </div>
    <div class="paint-canvas-container">
        <canvas id="paint-canvas"></canvas>
    </div>
</div>

<div id="app-music" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🍂🎺Autumn Playlist</span>
        <button class="close-btn" onclick="closeApp('app-music')">X</button>
    </div>
    <div class="music-content">
           <iframe data-testid="embed-iframe" style="border-radius:0px" src="https://open.spotify.com/embed/playlist/4ANYvxgZt95b26WWSC5wUw?utm_source=generator&theme=0&si=627780cfcac94f06" width="100%" height="100%" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>" 
    </div>
</div>

<div id="app-bucketlist" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🍂 Fall Bucket List</span>
        <button class="close-btn" onclick="closeApp('app-bucketlist')">X</button>
    </div>

<div id="app-gallery" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🖼️ Autumn Gallery</span>
        <button class="close-btn" onclick="closeApp('app-gallery')">X</button>
    </div>
    <div class="gallery-content-fullscreen">

    <div class="bucketlist-content">
        <ul class="bucket-list">
            <li><label><input type="checkbox"> 🎃 Visit a pumpkin patch</label></li>
            <li><label><input type="checkbox"> 📙 Read a book</label></li>
            <li><label><input type="checkbox"> 🥧 Bake</label></li>
            <li><label><input type="checkbox"> 👻 Halloween Party</label></li>
            <li><label><input type="checkbox"> 🍂 Go for a nature walk</label></li>
            <li><label><input type="checkbox"> 🐦‍🔥 Go Birdwatching</label></li>
            <li><label><input type="checkbox"> 🏕️ Go Camping</label></li>
            <li><label><input type="checkbox"> ☕ Drink hot chocolate</label></li>
            <li><label><input type="checkbox"> 🎃 Carve a pumpkin</label></li>
            <li><label><input type="checkbox"> 🎥🍂 Watch a movie</label></li>
        </ul>

</div>


<div class="dock-container">
    <nav class="dock">
        <div class="dock-icon" title="Paint" onclick="document.getElementById('paint-app').style.display='flex'">🖌️</div>
        <div class="dock-icon" title="Calculator" onclick="openApp('app-calculator')">🧮</div>
        <div class="dock-icon" title="Notepad" onclick="openApp('app-notepad')">📝</div>
        <div class="dock-icon" title="Stopwatch" onclick="openApp('timer-app')">🕰️</div>
        <div class="dock-icon" title="Bucket List" onclick="openApp('app-bucketlist')">🍂</div>
        <div class="dock-icon" title="Gallery" onclick="openApp('app-gallery')">🖼️</div>
        <div class="dock-icon" title="Music Player" onclick="openApp('app-music')">🎺</div>

    <script>
        function updateClock() {
            const now = new Date();
            const dateShort = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('current-date').textContent = dateShort;

            const hours = now.getHours() % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('center-time').textContent = `${hours}:${minutes}`;

            const dateFull = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('center-date-sub').textContent = dateFull;
        }

        setInterval(updateClock, 1000);
        updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    function updateAllBatteryInfo() {
                        const level = Math.round(battery.level * 100);
                        const isCharging = battery.charging;
                        document.getElementById('battery-status').textContent = `${isCharging ? '⚡' : '🔋'} ${level}%`;
                    }

                    updateAllBatteryInfo();

                    battery.addEventListener('levelchange', updateAllBatteryInfo);
                    battery.addEventListener('chargingchange', updateAllBatteryInfo);
                });
            } else {
                document.getElementById('battery-status').textContent = '🔋 N/A';
            }
        }

        updateBattery();

        function openApp(appId) {
            const targetWindow = document.getElementById(appId);
            if (targetWindow) {
                targetWindow.style.display = 'flex';
            } else {
                alert("This app window is coming next!");
            }
        }

        function closeApp(appId) {
            document.getElementById(appId).style.display = 'none';
        }

        let calcScreen = document.getElementById('calc-screen');
        function appendCalc(val) {
            if (calcScreen.value === '0') calcScreen.value = '';
            calcScreen.value += val;
        }
        function clearCalc() {
            calcScreen.value = '0';
        }
        function solveCalc() {
            try {
                calcScreen.value = eval(calcScreen.value);
            } catch {
                calcScreen.value = 'Error';
            }
        }
        const canvas = document.getElementById('paint-canvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('paint-color');
const sizePicker = document.getElementById('paint-size');
const sizeDisplay = document.getElementById('size-display');
const clearBtn = document.getElementById('paint-clear-btn');

let isDrawing = false;

function resizeCanvas() {
    const container = canvas.parentElement;
    if (container.clientWidth && container.clientHeight) {

        const tempImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.putImageData(tempImageData, 0, 0);
    }
}

canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = sizePicker.value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

sizePicker.addEventListener('input', (e) => {
    sizeDisplay.textContent = `${e.target.value}px`;
});

clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});

window.addEventListener('load', () => {
    const container = canvas.parentElement;
    canvas.width = container.clientWidth || 600;
    canvas.height = container.clientHeight || 400;
});
function closeWindow(id) {
    const win = document.getElementById(id);
    if (win) {
        win.classList.add('hidden');
        win.style.display = 'none';
    }
}

let timerInterval = null;
let totalTimeInSeconds = 0;
let remainingTimeInSeconds = 0;

    const minutesInput = document.getElementById('timer-minutes');
    const secondsInput = document.getElementById('timer-seconds');
    const timerDisplay = document.getElementById('timer-display');

function formatTime(totalSecs){
    const mins = Math.floor(totalSecs / 60);
    const secs = totalSecs % 60;
    const formattedMins = String(mins).padStart(2, '0');
    const formattedSecs = String(secs).padStart(2, '0');
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function updateTimerDisplay() {
    timerDisplay.textContent = formatTime(remainingTimeInSeconds);
}

function startTimer() {
    if (timerInterval) return;

    totalTimeInSeconds = parseInt(minutesInput.value) * 60 + parseInt(secondsInput.value);
    remainingTimeInSeconds = totalTimeInSeconds;

    if (remainingTimeInSeconds === 0) {
        const mins = parseInt(minutesInput.value) || 0;
        const secs = parseInt(secondsInput.value) || 0;
        timerDisplay.textContent = formatTime((mins * 60) + secs);
        remainingTimeInSeconds = totalTimeInSeconds;
    }

    if (remainingTimeInSeconds <= 0) {
        alert("Please set a valid time.");
        return;
    }

    updateTimerDisplay();

    timerInterval = setInterval(() => {
        remainingTimeInSeconds--;
        updateTimerDisplay();

        if (remainingTimeInSeconds <= 0) {
            pauseTimer();
            alert("Time's up!");
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    pauseTimer();
    remainingTimeInSeconds = 0;
    timerDisplay.textContent = "00:00";
    minutesInput.value = "";
    secondsInput.value = "";
}

function openApp(appId) {
    const app = document.getElementById(appId);
    if (app) {
        app.style.display = 'block';
    }
}

function closeApp(appId) {
    const app = document.getElementById(appId);
    if (app) {
        app.style.display = 'none';
    }
}

function openApp(appId) {
    const app = document.getElementById(appId);
    if (app) {
        app.style.display = 'block';
    }
}

function closeApp(appId) {
    const app = document.getElementById(appId);
    if (app) {
        app.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    makeWindowsDraggable();
});

function makeWindowsDraggable() {
    const headers = document.querySelectorAll('.window-header');

    headers.forEach(header => {
        header.addEventListener('mousedown', dragMouseDown);
    });
}

function dragMouseDown(e) {
    if (e.target.classList.contains('close-btn')) return;

    e.preventDefault();
    
    const appWindow = e.currentTarget.parentElement;

    let posX = e.clientX;
    let posY = e.clientY;

    document.querySelectorAll('.app-window').forEach(win => win.style.zIndex = '1000');
    appWindow.style.zIndex = '10000';

    function elementDrag(e) {
        e.preventDefault();
        
        const dx = posX - e.clientX;
        const dy = posY - e.clientY;
        posX = e.clientX;
        posY = e.clientY;

        appWindow.style.top = (appWindow.offsetTop - dy) + "px";
        appWindow.style.left = (appWindow.offsetLeft - dx) + "px";
        appWindow.style.transform = "none"; 
    }

    function closeDragElement() {
        document.removeEventListener('mousemove', elementDrag);
        document.removeEventListener('mouseup', closeDragElement);
    }

    document.addEventListener('mousemove', elementDrag);
    document.addEventListener('mouseup', closeDragElement);
}

</script>
</body>
</html>
