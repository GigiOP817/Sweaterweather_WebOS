<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <div class="desktop">

        <header class="top-navbar">
            <div class="nav-left">
                <span class="nav-brand"> Autumn OS</span>
            </div>
            <div class="nav-right">
                <span id="current-date">Sun, Sep 20</span>
                <span id="battery-status">🔋 100%</span>
            </div>
        </header>


        <main class="center-clock-container">
            <h1 id="center-time">4:30</h1>
            <p id="center-date-sub">Sunday, September 20</p>
        </main>

        <div class="window" id="app-notepad">
            <div class="window-header">
                <span>📝 Notepad</span>
                <button class="close-btn" onclick="closeApp('app-notepad')">×</button>
            </div>
            <div class="window-content">
                <textarea class="notepad-area" placeholder="Write your thoughts here..."></textarea>
            </div>
        </div>


        <div class="window" id="app-calculator">
            <div class="window-header">
                <span>🧮 Calculator</span>
                <button class="close-btn" onclick="closeApp('app-calculator')">×</button>
            </div>
            <div class="window-content calc-body">
                <input type="text" id="calc-screen" readonly value="0">
                <div class="calc-buttons">
                    <button onclick="clearCalc()">C</button>
                    <button onclick="appendCalc('/')">/</button>
                    <button onclick="appendCalc('*')">*</button>
                    <button onclick="appendCalc('-')">-</button>
                    <button onclick="appendCalc('7')">7</button>
                    <button onclick="appendCalc('8')">8</button>
                    <button onclick="appendCalc('9')">9</button>
                    <button onclick="appendCalc('+')">+</button>
                    <button onclick="appendCalc('4')">4</button>
                    <button onclick="appendCalc('5')">5</button>
                    <button onclick="appendCalc('6')">6</button>
                    <button onclick="solveCalc()" class="equal-btn">=</button>
                    <button onclick="appendCalc('1')">1</button>
                    <button onclick="appendCalc('2')">2</button>
                    <button onclick="appendCalc('3')">3</button>
                    <button onclick="appendCalc('0')">0</button>
                </div>
            </div>
        </div>

       <div id="paint-app" class="window" style="display: none;">
    <div class="window-header">
        <span class="window-title">Paint</span>
        <button class="close-btn" onclick="document.getElementById('paint-app').style.display='none'">×</button>
    </div>
    <div class="paint-toolbar">
        <label for="paint-color">Color:</label>
        <input type="color" id="paint-color" value="#000000">
        
        <label for="paint-size">Size:</label>
        <input type="range" id="paint-size" min="1" max="50" value="5">
        <span id="size-display">5px</span>
        
        <button id="paint-clear-btn">Clear</button>
    </div>
    <div class="paint-canvas-container">
        <canvas id="paint-canvas"></canvas>
    </div>
</div>

<div id="app-music" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🍂🎺Autumn Playlist</span>
        <button class="close-btn" onclick="closeApp('app-music')">X</button>
    </div>
    <div class="music-content">

    </div>
</div>

<div id="app-bucketlist" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🍂 Fall Bucket List</span>
        <button class="close-btn" onclick="closeApp('app-bucketlist')">X</button>
    </div>

    <div class="bucketlist-content">
        <ul class="bucket-list">
            <li><label><input type="checkbox"> 🎃 Visit a pumpkin patch</label></li>
            <li><label><input type="checkbox"> 📙 Read a book</label></li>
            <li><label><input type="checkbox"> 🥧 Bake</label></li>
            <li><label><input type="checkbox"> 👻 Halloween Party</label></li>
            <li><label><input type="checkbox"> 🍂 Go for a nature walk</label></li>
            <li><label><input type="checkbox"> 🐦‍🔥 Go Birdwatching</label></li>
            <li><label><input type="checkbox"> 🏕️ Go Camping</label></li>
            <li><label><input type="checkbox"> ☕ Drink hot chocolate</label></li>
            <li><label><input type="checkbox"> 🎃 Carve a pumpkin</label></li>
            <li><label><input type="checkbox"> 🎥🍂 Watch a movie</label></li>
        </ul>
    </div>
</div>

<div id="app-gallery" class="app-window fullscreen-app" style="display: none;">
    <div class="gallery-topbar">
        <div class="gallery-title">
            <span>🍂📷 Autumn Gallery</span>
            <small id="gallery-counter">1 / 5</small>
        </div>
        <button class="gallery-close-btn" onclick="closeApp('app-gallery')" title="Close Gallery">✕</button>
    </div>

    <div class="gallery-stage">
        <div class="gallery-frame">
            <div class="gallery-image-wrapper">
                <img id="gallery-display-img" src="" alt="Autumn Image">
            </div>
            
            <div class="gallery-info-bar">
                <div class="gallery-details">
                    <h2 id="gallery-img-title">Autumn Aesthetic</h2>
                </div>
                <button class="set-wallpaper-btn" onclick="applyCurrentWallpaper()">
                     Set as Wallpaper
                </button>
            </div>
        </div>

        <button class="slide-nav-btn prev-btn" onclick="prevGalleryImage()">❮</button>
        <button class="slide-nav-btn next-btn" onclick="nextGalleryImage()">❯</button>
    </div>
</div>

<div id="app-timer" class="app-window" style="display: none;">
    <div class="window-header">
        <span>🍁 Timer</span>
        <button class="close-btn" onclick="closeApp('app-timer')" title="Close">✕</button>
    </div>

    <div class="timer-content">
        <div class="timer-display" id="timer-display">00:05:00</div>

        <div class="timer-inputs">
            <div class="input-group">
                <input type="number" id="timer-hours" min="0" max="23" value="0" placeholder="00" oninput="updateDisplayFromInputs()">
                <label>HRS</label>
            </div>
            <span>:</span>
            <div class="input-group">
                <input type="number" id="timer-minutes" min="0" max="59" value="5" placeholder="05" oninput="updateDisplayFromInputs()">
                <label>MIN</label>
            </div>
            <span>:</span>
            <div class="input-group">
                <input type="number" id="timer-seconds" min="0" max="59" value="0" placeholder="00" oninput="updateDisplayFromInputs()">
                <label>SEC</label>
            </div>
        </div>

        <div class="timer-controls">
            <button class="timer-btn primary" id="timer-start-btn" onclick="toggleTimer()">Start</button>
            <button class="timer-btn" onclick="resetTimer()">Reset</button>
        </div>
    </div>
</div>


<div class="dock-container">
    <nav class="dock">
        <div class="dock-icon" title="Paint" onclick="document.getElementById('paint-app').style.display='flex'">🖌️</div>
        <div class="dock-icon" title="Calculator" onclick="openApp('app-calculator')">🧮</div>
        <div class="dock-icon" title="Notepad" onclick="openApp('app-notepad')">📝</div>
        <div class="dock-icon" title="Timer" onclick="openApp('app-timer')">🕰️</div>
        <div class="dock-icon" title="Bucket List" onclick="openApp('app-bucketlist')">🍂</div>
        <div class="dock-icon" title="Music Player" onclick="openApp('app-music')">🎺</div>
        <div class="dock-icon" title="Gallery" onclick="openApp('app-gallery'); updateGalleryDisplay();">🖼️</div>
    </nav>
</div>

    <script>
        function updateClock() {
            const now = new Date();
            const dateShort = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            document.getElementById('current-date').textContent = dateShort;

            const hours = now.getHours() % 12 || 12;
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('center-time').textContent = `${hours}:${minutes}`;

            const dateFull = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            document.getElementById('center-date-sub').textContent = dateFull;
        }

        setInterval(updateClock, 1000);
        updateClock();

        function updateBattery() {
            if ('getBattery' in navigator) {
                navigator.getBattery().then(battery => {
                    function updateAllBatteryInfo() {
                        const level = Math.round(battery.level * 100);
                        const isCharging = battery.charging;
                        document.getElementById('battery-status').textContent = `${isCharging ? '⚡' : '🔋'} ${level}%`;
                    }

                    updateAllBatteryInfo();

                    battery.addEventListener('levelchange', updateAllBatteryInfo);
                    battery.addEventListener('chargingchange', updateAllBatteryInfo);
                });
            } else {
                document.getElementById('battery-status').textContent = '🔋 N/A';
            }
        }

        updateBattery();

        function openApp(appId) {
            const targetWindow = document.getElementById(appId);
            if (targetWindow) {
                targetWindow.style.display = 'flex';
            } else {
                alert("This app window is coming next!");
            }
        }

        function closeApp(appId) {
            document.getElementById(appId).style.display = 'none';
        }

        let calcScreen = document.getElementById('calc-screen');
        function appendCalc(val) {
            if (calcScreen.value === '0') calcScreen.value = '';
            calcScreen.value += val;
        }
        function clearCalc() {
            calcScreen.value = '0';
        }
        function solveCalc() {
            try {
                calcScreen.value = eval(calcScreen.value);
            } catch {
                calcScreen.value = 'Error';
            }
        }
        const canvas = document.getElementById('paint-canvas');
const ctx = canvas.getContext('2d');
const colorPicker = document.getElementById('paint-color');
const sizePicker = document.getElementById('paint-size');
const sizeDisplay = document.getElementById('size-display');
const clearBtn = document.getElementById('paint-clear-btn');

let isDrawing = false;

function resizeCanvas() {
    const container = canvas.parentElement;
    if (container.clientWidth && container.clientHeight) {

        const tempImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        ctx.putImageData(tempImageData, 0, 0);
    }
}

canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = sizePicker.value;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

canvas.addEventListener('mouseup', () => isDrawing = false);
canvas.addEventListener('mouseleave', () => isDrawing = false);

sizePicker.addEventListener('input', (e) => {
    sizeDisplay.textContent = `${e.target.value}px`;
});

clearBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});

window.addEventListener('load', () => {
    const container = canvas.parentElement;
    canvas.width = container.clientWidth || 600;
    canvas.height = container.clientHeight || 400;
});

    const win = document.getElementById(id);
    if (win) {
        win.classList.add('hidden');
        win.style.display = 'none';
    }
}

    }
}

function closeApp(appId) {
    const app = document.getElementById(appId);

document.addEventListener('DOMContentLoaded', () => {
    makeWindowsDraggable();
});

function makeWindowsDraggable() {
    const headers = document.querySelectorAll('.window-header');

    headers.forEach(header => {
        header.addEventListener('mousedown', dragMouseDown);
    });
}

function dragMouseDown(e) {
    if (e.target.classList.contains('close-btn')) return;

    e.preventDefault();
    
    const appWindow = e.currentTarget.parentElement;

    let posX = e.clientX;
    let posY = e.clientY;

    document.querySelectorAll('.app-window').forEach(win => win.style.zIndex = '1000');
    appWindow.style.zIndex = '10000';

    function elementDrag(e) {
        e.preventDefault();
        
        const dx = posX - e.clientX;
        const dy = posY - e.clientY;
        posX = e.clientX;
        posY = e.clientY;

        appWindow.style.top = (appWindow.offsetTop - dy) + "px";
        appWindow.style.left = (appWindow.offsetLeft - dx) + "px";
        appWindow.style.transform = "none"; 
    }

    function closeDragElement() {
        document.removeEventListener('mousemove', elementDrag);
        document.removeEventListener('mouseup', closeDragElement);
    }

    document.addEventListener('mousemove', elementDrag);
    document.addEventListener('mouseup', closeDragElement);
}

const autumnGalleryData = [
    {
        url: "https://i.pinimg.com/736x/19/c5/1d/19c51d8570e6c78b02127dc6dc32aaa5.jpg",
        title: "Autumn Leaves"
    },
    {
        url: "https://i.pinimg.com/1200x/40/11/e1/4011e1c7eb12543955bf9c6a688853d8.jpg",
        title: "Snoopy"
    },
    {
        url: "https://i.pinimg.com/1200x/91/45/0b/91450b73ebfc6354f9e64cbf07d2b31b.jpg",
        title: "Forest"
    },
    {
        url: "https://i.pinimg.com/1200x/72/61/35/72613517616ef6649ccb1848c252a270.jpg",
        title: "Spooky"
    },
    {
        url: "https://i.pinimg.com/1200x/3e/dc/61/3edc61b8b089ea7087129da120808c3b.jpg",
        title: "Nature"
    }
];

let currentGalleryIndex = 0;

function updateGalleryDisplay() {
    const item = autumnGalleryData[currentGalleryIndex];
    const imgElement = document.getElementById('gallery-display-img');
    const titleElement = document.getElementById('gallery-img-title');
    const counterElement = document.getElementById('gallery-counter');

    if (imgElement) imgElement.src = item.url;
    if (titleElement) titleElement.textContent = item.title;
    if (counterElement) counterElement.textContent = `${currentGalleryIndex + 1} / ${autumnGalleryData.length}`;
}

function nextGalleryImage() {
    currentGalleryIndex = (currentGalleryIndex + 1) % autumnGalleryData.length;
    updateGalleryDisplay();
}

function prevGalleryImage() {
    currentGalleryIndex = (currentGalleryIndex - 1 + autumnGalleryData.length) % autumnGalleryData.length;
    updateGalleryDisplay();
}

function applyCurrentWallpaper() {
    const item = autumnGalleryData[currentGalleryIndex];
    const desktop = document.querySelector('.desktop');
    
    if (desktop) {
        desktop.style.backgroundImage = `url('${item.url}')`;
        desktop.style.backgroundSize = 'cover';
        desktop.style.backgroundPosition = 'center';
    }
}

function openGalleryApp() {
    const galleryWin = document.getElementById('app-gallery');
    if (galleryWin) {
        galleryWin.style.display = 'flex';
}
}

let timerInterval = null;
let totalSeconds = 300; 
let isTimerRunning = false;

function formatTime(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;

    return String(hrs).padStart(2, '0') + ':' +
           String(mins).padStart(2, '0') + ':' +
           String(secs).padStart(2, '0');
}


function updateDisplayFromInputs() {
    if (isTimerRunning) return; 

    const h = parseInt(document.getElementById('timer-hours').value, 10) || 0;
    const m = parseInt(document.getElementById('timer-minutes').value, 10) || 0;
    const s = parseInt(document.getElementById('timer-seconds').value, 10) || 0;

    totalSeconds = (h * 3600) + (m * 60) + s;
    const displayEl = document.getElementById('timer-display');
    if (displayEl) {
        displayEl.textContent = formatTime(totalSeconds);
    }
}

function toggleTimer() {
    const startBtn = document.getElementById('timer-start-btn');
    const displayEl = document.getElementById('timer-display');

    if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        if (startBtn) {
            startBtn.textContent = 'Start';
            startBtn.style.background = '#d35400';
        }
    } else {
        if (totalSeconds <= 0) {
            updateDisplayFromInputs();
        }

        if (totalSeconds <= 0) return; 

        isTimerRunning = true;
        if (startBtn) {
            startBtn.textContent = 'Pause';
            startBtn.style.background = '#c0392b';
        }

        timerInterval = setInterval(() => {
            totalSeconds--;
            if (displayEl) {
                displayEl.textContent = formatTime(totalSeconds);
            }

            if (totalSeconds <= 0) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                if (startBtn) {
                    startBtn.textContent = 'Start';
                    startBtn.style.background = '#d35400';
                }
                alert('🍁 Time is up!');
            }
        }, 1000);
    }
}

function resetTimer() {
    clearInterval(timerInterval);
    isTimerRunning = false;

    const hrsInput = document.getElementById('timer-hours');
    const minsInput = document.getElementById('timer-minutes');
    const secsInput = document.getElementById('timer-seconds');
    const startBtn = document.getElementById('timer-start-btn');

    if (hrsInput) hrsInput.value = 0;
    if (minsInput) minsInput.value = 5;
    if (secsInput) secsInput.value = 0;

    totalSeconds = 300;
    const displayEl = document.getElementById('timer-display');
    if (displayEl) {
        displayEl.textContent = formatTime(totalSeconds);
    }

    if (startBtn) {
        startBtn.textContent = 'Start';
        startBtn.style.background = '#d35400';
    }
}

</script>
